  <!-- Shield Base -->
  <path d="M 100 12 C 145 12 178 28 182 75 C 182 130 135 175 100 190 C 65 175 18 130 18 75 C 22 28 55 12 100 12 Z" fill="url(#shieldGrad)" stroke="url(#amberGrad)" stroke-width="6"/>

