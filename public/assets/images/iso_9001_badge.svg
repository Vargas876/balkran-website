<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="isoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Outer Seal Circle -->
  <circle cx="100" cy="100" r="94" fill="url(#isoGrad)" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#ffffff" stroke-dasharray="4,3" stroke-width="1.5" opacity="0.6"/>

  <!-- Inner Banner Box -->
  <rect x="25" y="75" width="150" height="50" rx="6" fill="url(#goldGrad)" />

  <!-- Main Text -->
  <text x="100" y="55" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="19" fill="#ffffff" text-anchor="middle" letter-spacing="1">CALIDAD</text>
  <text x="100" y="107" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="24" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">ISO 9001</text>
  <text x="100" y="148" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#fbbf24" text-anchor="middle" letter-spacing="1.5">SISTEMA CERTIFICADO</text>
  <text x="100" y="166" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.9">NORMA 2015</text>

  <!-- Decorative Stars -->
  <path d="M100 22 L102.5 28 L109 29 L104 33.5 L105.5 40 L100 36.5 L94.5 40 L96 33.5 L91 29 L97.5 28 Z" fill="url(#goldGrad)"/>
</svg>